name: Feature request
description: Propose a change to the workflow, its outputs or its reports.
title: "Feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Write the request as a user story, then list the acceptance criteria. Search the open and closed issues first to avoid a duplicate.

        If you want to add a variant caller, use the "new caller" form instead.
  - type: input
    id: role
    attributes:
      label: As a
      description: "Who needs this. Name a role, not a person."
      placeholder: "clinical bioinformatician validating a germline pipeline"
    validations:
      required: true
  - type: textarea
    id: want
    attributes:
      label: I want
      description: "What the workflow should do that it does not do now."
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: So that
      description: "The outcome this gives you, and what you cannot do without it."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: "One testable statement per line. Name the output path, report section or config key where it applies."
      placeholder: |
        - The report has a section that lists the stratification regions with the lowest F1.
        - The section is built from the existing vcfeval output, with no new tool.
    validations:
      required: true
  - type: dropdown
    id: contract
    attributes:
      label: Effect on the output contract or config schema
      description: "This decides the version number. See CONTRIBUTING.md."
      options:
        - None
        - Additive (new outputs or optional config keys)
        - Breaking (changes or removes existing outputs or config keys)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: "Other ways to get the same result, including doing it outside the workflow."
