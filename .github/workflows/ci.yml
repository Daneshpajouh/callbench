name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # The genotype filter and stratum count tests run bcftools, bgzip and
      # tabix and skip without them. Only the three tools go on PATH, not the
      # environment's own Python.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: htstools
          create-args: bcftools=1.24
          condarc: |
            channels:
              - conda-forge
              - bioconda
      - name: Put bcftools, bgzip and tabix on PATH
        shell: bash
        run: |
          mkdir -p "$HOME/htstools-bin"
          for tool in bcftools bgzip tabix; do
            ln -s "$MAMBA_ROOT_PREFIX/envs/htstools/bin/$tool" "$HOME/htstools-bin/$tool"
          done
          echo "$HOME/htstools-bin" >> "$GITHUB_PATH"
      - run: snakemake --lint
      - run: snakefmt --check workflow
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: shellcheck tools/*.sh
        if: runner.os == 'Linux'
      - name: Unit tests; fail if a tool test skipped
        shell: bash
        run: |
          python -m pytest -q -rs --cov=workflow/scripts --cov=tools tests/unit | tee pytest.log
          if grep -q "not on PATH" pytest.log; then
            echo "A test that needs bcftools, bgzip or tabix was skipped." >&2
            exit 1
          fi
      - run: python -m pytest -q -m workflow tests/workflow

  test-workflow:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Run the bundled HG002 slice
        shell: bash -el {0}
        run: snakemake --profile profiles/test --cores 2
      - name: Check accuracy did not regress
        shell: bash -el {0}
        run: python tools/check_accuracy.py .tests/integration/results/report/accuracy.tsv .tests/expected_accuracy.tsv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-run-logs
          path: .tests/integration/logs
