name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # Nothing is published until the tests, the version check and the image test
  # have passed: checks -> image (build, test, push) -> release.
  checks:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Check that the tag matches the recorded version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cff_version="$(sed -n -E 's/^version: *"?([0-9]+\.[0-9]+\.[0-9]+)"?[[:space:]]*$/\1/p' CITATION.cff)"
          zenodo_version="$(python3 -c 'import json; print(json.load(open(".zenodo.json"))["version"])')"
          echo "Tag: ${tag_version}"
          echo "CITATION.cff: ${cff_version}"
          echo ".zenodo.json: ${zenodo_version}"
          if [ "${tag_version}" = "${cff_version}" ] && [ "${tag_version}" = "${zenodo_version}" ]; then
            echo "The tag matches the recorded version."
          else
            echo "The tag ${GITHUB_REF_NAME} does not match the version in CITATION.cff or .zenodo.json." >&2
            exit 1
          fi

      - name: Extract the changelog section for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="${RUNNER_TEMP}/release-notes.md"
          awk -v ver="${version}" '
            /^## / {
              if (found) exit
              heading = $0
              sub(/^## +\[?/, "", heading)
              sub(/\].*$/, "", heading)
              sub(/ .*$/, "", heading)
              if (heading == ver) found = 1
              next
            }
            found { print }
          ' CHANGELOG.md > "${notes}"
          if grep -q '[^[:space:]]' "${notes}"; then
            echo "Release notes for ${version}:"
            cat "${notes}"
          else
            echo "CHANGELOG.md has no entries under a heading for version ${version}." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md

  image:
    # The Dockerfile comes from `snakemake --containerize` and holds one
    # prebuilt conda environment per rule; on a cluster, run with
    # `--sdm conda apptainer` and Snakemake uses these instead of solving.
    runs-on: ubuntu-latest
    needs: [checks, version]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/daneshpajouh/callbench:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build --platform linux/amd64 -t "$IMAGE" .
      - name: Integration test inside the image before it is pushed
        # Same steps as image-test.yml: snakemake is installed with pip into a
        # venv on the image's Python (that step uses the network); the workflow
        # reads only the bundled test data.
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$IMAGE" bash -c '
            set -euo pipefail
            py=""
            for d in /conda-envs/*/; do
              if "${d}bin/python3" -c "import pandas, matplotlib" 2>/dev/null; then py="$d"; break; fi
            done
            "${py}bin/python3" -m venv --system-site-packages /tmp/venv
            /tmp/venv/bin/pip install --quiet snakemake==9.27.0
            export PATH="/tmp/venv/bin:$(printf "%s:" /conda-envs/*/bin)$PATH"
            snakemake --directory .tests/integration --cores 4 \
              --resources mem_mb=6000 --default-resources mem_mb=1000 runtime=10 \
              --retries 1 --show-failed-logs
            python3 tools/check_accuracy.py .tests/integration/results/report/accuracy.tsv .tests/expected_accuracy.tsv
          '
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image
        run: docker push "$IMAGE"

  release:
    runs-on: ubuntu-latest
    needs: image
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
